name: Cut Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: true
        type: choice
        default: stable
        options:
          - stable
          - rc
      ref:
        description: Branch, tag, or SHA to release from
        required: false
        type: string
        default: main
      dry_run:
        description: Compute the next version without building or publishing
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-cut
  cancel-in-progress: false

env:
  ALERA_FLAVOR: release

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      target_sha: ${{ steps.release_plan.outputs.target_sha }}
      channel: ${{ steps.release_plan.outputs.channel }}
      any_should_release: ${{ steps.release_plan.outputs.any_should_release }}
      desktop_should_release: ${{ steps.release_plan.outputs.desktop_should_release }}
      desktop_artifact_version: ${{ steps.release_plan.outputs.desktop_artifact_version }}
      desktop_release_version: ${{ steps.release_plan.outputs.desktop_release_version }}
      desktop_build_number: ${{ steps.release_plan.outputs.desktop_build_number }}
      desktop_tag: ${{ steps.release_plan.outputs.desktop_tag }}
      mobile_should_release: ${{ steps.release_plan.outputs.mobile_should_release }}
      mobile_artifact_version: ${{ steps.release_plan.outputs.mobile_artifact_version }}
      mobile_release_version: ${{ steps.release_plan.outputs.mobile_release_version }}
      mobile_build_number: ${{ steps.release_plan.outputs.mobile_build_number }}
      mobile_tag: ${{ steps.release_plan.outputs.mobile_tag }}
    steps:
      - name: Checkout ref
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          submodules: false

      - name: Setup Dart
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260

      - name: Plan product releases
        id: release_plan
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REF: ${{ inputs.ref }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          git fetch origin main --tags --quiet
          dart tool/release/release_plan.dart \
            --target "$TARGET_REF" \
            --channel "$RELEASE_CHANNEL" \
            --repository "$GITHUB_REPOSITORY" \
            --run-number "$GITHUB_RUN_NUMBER" \
            --dry-run "$DRY_RUN" \
            --github-output "$GITHUB_OUTPUT" \
            --summary "$GITHUB_STEP_SUMMARY"

  build_windows_x64:
    name: build windows x64
    needs: plan
    if: needs.plan.outputs.desktop_should_release == 'true'
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - name: Checkout release ref
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ needs.plan.outputs.target_sha }}
          submodules: false

      - name: Require x64 runner
        shell: pwsh
        run: |
          if ($env:RUNNER_ARCH -ne 'X64') {
            throw "Expected an X64 runner, got $env:RUNNER_ARCH."
          }

      - name: Setup Flutter workspace
        uses: ./.github/actions/setup-flutter-workspace
        with:
          rust: 'true'

      - name: Tune Windows build environment
        uses: ./.github/actions/tune-windows-build

      - name: Apply release version locally
        run: dart tool/release/update_pubspec_version.dart "${{ needs.plan.outputs.desktop_artifact_version }}" "${{ needs.plan.outputs.desktop_build_number }}"

      - name: Build Windows release
        run: flutter build windows --release --dart-define=ALERA_FLAVOR=release

      - name: Verify Windows bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle="build/windows/x64/runner/Release"
          test -d "$bundle" || { echo "::error::Missing Windows x64 bundle at $bundle"; exit 1; }
          dart tool/native_helpers/verify_desktop_runtime_bundle.dart \
            --platform windows \
            --bundle "$bundle"

      - name: Package Windows x64 assets
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.desktop_release_version }}
        run: |
          $bundle = 'build/windows/x64/runner/Release'
          $assets = 'windows-release-assets'
          $zip = "$assets/alera-$env:RELEASE_VERSION-windows-x64.zip"
          $archive = "$assets/alera-$env:RELEASE_VERSION-windows-x64.tar.gz"
          New-Item -ItemType Directory -Force -Path $assets | Out-Null
          Compress-Archive -Path "$bundle/*" -DestinationPath $zip
          tar -czf $archive -C $bundle .
          foreach ($asset in @($zip, $archive)) {
            $hash = (Get-FileHash -Algorithm SHA256 -Path $asset).Hash.ToLowerInvariant()
            $name = Split-Path -Leaf $asset
            Set-Content -Path "$asset.sha256" -Value "$hash  $name" -Encoding ascii
          }

      - name: Upload Windows x64 assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-x64-release-assets
          path: windows-release-assets
          if-no-files-found: error
          retention-days: 7

  build_android:
    name: build android
    needs: plan
    if: needs.plan.outputs.mobile_should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout release ref
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ needs.plan.outputs.target_sha }}
          submodules: false

      - name: Setup Flutter workspace
        uses: ./.github/actions/setup-flutter-workspace
        with:
          working-directory: mobile
          submodules: third_party/xterm
          linux-toolchain: 'false'
          native-assets: 'false'
          preflight: 'false'

      - name: Apply mobile release version locally
        run: dart tool/release/update_mobile_pubspec_version.dart "${{ needs.plan.outputs.mobile_artifact_version }}" "${{ needs.plan.outputs.mobile_build_number }}"

      - name: Build debug-signed Android release APKs
        working-directory: mobile
        run: |
          set -euo pipefail
          test ! -f android/key.properties || { echo "::error::Secret-backed Android signing is not supported by this fork workflow."; exit 1; }
          flutter build apk --release
          flutter build apk --release --split-per-abi

      - name: Verify Android APK signatures
        shell: bash
        run: |
          set -euo pipefail
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -n "$apksigner" || { echo "::error::Could not find apksigner"; exit 1; }
          for apk in mobile/build/app/outputs/flutter-apk/*-release.apk; do
            "$apksigner" verify --print-certs "$apk"
          done

      - name: Stage Android assets
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.mobile_release_version }}
        run: |
          set -euo pipefail
          source_dir="mobile/build/app/outputs/flutter-apk"
          assets="android-release-assets"
          mkdir -p "$assets"
          cp "$source_dir/app-release.apk" "$assets/alera-${RELEASE_VERSION}-android.apk"
          cp "$source_dir/app-arm64-v8a-release.apk" "$assets/alera-${RELEASE_VERSION}-android-arm64-v8a.apk"
          cp "$source_dir/app-armeabi-v7a-release.apk" "$assets/alera-${RELEASE_VERSION}-android-armeabi-v7a.apk"
          cp "$source_dir/app-x86_64-release.apk" "$assets/alera-${RELEASE_VERSION}-android-x86_64.apk"
          for asset in "$assets"/*.apk; do
            name="$(basename "$asset")"
            (cd "$assets" && sha256sum "$name" >"$name.sha256")
          done
          (cd "$assets" && sha256sum -c ./*.sha256)

      - name: Upload Android assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-release-assets
          path: android-release-assets
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish github releases
    needs:
      - plan
      - build_windows_x64
      - build_android
    if: >-
      always() &&
      needs.plan.outputs.any_should_release == 'true' &&
      (needs.build_windows_x64.result == 'success' || needs.build_windows_x64.result == 'skipped') &&
      (needs.build_android.result == 'success' || needs.build_android.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: '*-release-assets'
          path: release-assets

      - name: Verify selected release assets
        shell: bash
        env:
          DESKTOP_SHOULD_RELEASE: ${{ needs.plan.outputs.desktop_should_release }}
          MOBILE_SHOULD_RELEASE: ${{ needs.plan.outputs.mobile_should_release }}
        run: |
          set -euo pipefail
          if [[ "$DESKTOP_SHOULD_RELEASE" == "true" ]]; then
            test "$(find release-assets/windows-x64-release-assets -maxdepth 1 -type f | wc -l)" -eq 4
            (cd release-assets/windows-x64-release-assets && sha256sum -c ./*.sha256)
          fi
          if [[ "$MOBILE_SHOULD_RELEASE" == "true" ]]; then
            test "$(find release-assets/android-release-assets -maxdepth 1 -type f | wc -l)" -eq 8
            (cd release-assets/android-release-assets && sha256sum -c ./*.sha256)
          fi

      - name: Publish permanent GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.plan.outputs.target_sha }}
          CHANNEL: ${{ needs.plan.outputs.channel }}
          DESKTOP_SHOULD_RELEASE: ${{ needs.plan.outputs.desktop_should_release }}
          DESKTOP_RELEASE_VERSION: ${{ needs.plan.outputs.desktop_release_version }}
          DESKTOP_TAG: ${{ needs.plan.outputs.desktop_tag }}
          MOBILE_SHOULD_RELEASE: ${{ needs.plan.outputs.mobile_should_release }}
          MOBILE_RELEASE_VERSION: ${{ needs.plan.outputs.mobile_release_version }}
          MOBILE_TAG: ${{ needs.plan.outputs.mobile_tag }}
        run: |
          set -euo pipefail
          release_args=(--repo "$GITHUB_REPOSITORY" --target "$TARGET_SHA" --generate-notes)
          if [[ "$CHANNEL" == "rc" ]]; then
            release_args+=(--prerelease)
          fi
          if [[ "$DESKTOP_SHOULD_RELEASE" == "true" ]]; then
            gh release create "$DESKTOP_TAG" \
              release-assets/windows-x64-release-assets/* \
              "${release_args[@]}" \
              --title "Alera $DESKTOP_RELEASE_VERSION"
          fi
          if [[ "$MOBILE_SHOULD_RELEASE" == "true" ]]; then
            gh release create "$MOBILE_TAG" \
              release-assets/android-release-assets/* \
              "${release_args[@]}" \
              --title "Alera Mobile $MOBILE_RELEASE_VERSION"
          fi
